<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="crossword.css" />
    <title>Crossword</title>
</head>
<body>
    <header>
        <h1>
            Happy Birthday Crossword!
        </h1>
        <div id="game-options">
            <div id="check-answers">
                <button onClick="checkAnswers()">Check your Progress</button>
                <button onClick="removeClasses()">Remove Progress Check</button>
            </div>
            <div id="show-key">
                <button onClick="showKey()">Show Key</button>
                <button onClick="removeKey()">Remove Key</button>       
            </div>    
        </div>
    </header>
    <main>
        <div id="puzzle-holder"></div>
        <div id="hint-holder">
            <div id="a">
                <h2>Across</h2>
            </div> <!--Across-->
            <div id="d">
                <h2>Down</h2>
            </div> <!--Down-->
        </div>        
    </main>
</body>
<script src="crossword.js"></script>
</html>
